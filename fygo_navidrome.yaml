services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      - ND_RETIFSCANS=30s
      - ND_LOGLEVEL=info
    volumes:
      - /vol1/1000/Docker/navidrome:/data
      - /vol1/1000/Musica:/music
