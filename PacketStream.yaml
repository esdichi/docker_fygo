version: '3.8'

services:
  psclient:
    image: packetstream/psclient:latest
    container_name: psclient
    restart: always
    environment:
      - CID=Tu codigo

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --cleanup
      --include-stopped
      --include-restarting
      --revive-stopped
      --interval 60
      psclient