services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"
      - "68:68/tcp"
      - "8888:80/tcp"   
      - "3000:3000/tcp"
    volumes:
      - /vol1/1000/Docker/AdGuard/work:/opt/adguardhome/work
      - /vol1/1000/Docker/AdGuard/conf:/opt/adguardhome/conf
